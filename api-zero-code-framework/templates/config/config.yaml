# 统一配置（运行必需：base_url；其余可选）
base_url: ""          # 被测服务地址（运行必需；留空则运行报错，不空跑）
env: test             # 默认环境（dev/test/staging/prod），可用 --env / TEST_ENV 覆盖
token: ""             # 全局 token（可选）；鉴权在 request_client 注入，已有 Authorization 不覆盖
app: ""
device: ""

report:
  allure_dir: allure-results
  report_dir: reports/allure-report
  json_path: reports/report.json

